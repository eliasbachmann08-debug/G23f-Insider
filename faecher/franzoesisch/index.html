<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Französisch – G23f-Insider</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🇫🇷</text></svg>">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=DM+Serif+Display&display=swap');

  :root {
    --bg: #F5F1EA;
    --surface: #FFFDF9;
    --border: #DDD5C9;
    --accent: #00d4ff;
    --text: #201C18;
    --muted: #6F675E;
    --radius: 12px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(255,253,249,0.95);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
    padding: 0.9rem 2rem;
    display: flex;
    align-items: center;
    gap: 1rem;
  }
  .back-btn {
    color: var(--muted);
    text-decoration: none;
    font-size: 0.85rem;
    padding: 0.3rem 0.6rem;
    border-radius: 6px;
    border: 1px solid var(--border);
    transition: all 0.2s;
  }
  .back-btn:hover { color: var(--text); border-color: var(--muted); }
  .breadcrumb {
    font-size: 0.82rem;
    color: var(--muted);
  }
  .breadcrumb .cur {
    color: var(--accent);
    font-weight: 600;
  }

  .page-hero {
    max-width: 1100px;
    margin: 0 auto;
    padding: 3rem 2rem 2rem;
  }
  .subject-label {
    font-family: 'DM Serif Display', serif;
    font-size: 0.72rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 0.7rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  .subject-label::before {
    content: '';
    width: 18px;
    height: 2px;
    background: var(--accent);
    border-radius: 1px;
    display: inline-block;
  }
  .page-hero h1 {
    font-family: 'DM Serif Display', serif;
    font-size: clamp(2rem, 5vw, 3rem);
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.15;
    margin-bottom: 0.7rem;
  }
  .page-hero p {
    font-size: 0.92rem;
    color: var(--muted);
    max-width: 520px;
    line-height: 1.65;
  }

  .section {
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 2rem 8rem;
  }
  .section-title {
    font-family: 'DM Serif Display', serif;
    font-size: 0.72rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 1.2rem;
    display: flex;
    align-items: center;
    gap: 0.7rem;
  }
  .section-title::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .topics-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 1rem;
  }

  .topic-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.4rem;
    text-decoration: none;
    color: var(--text);
    transition: all 0.22s ease;
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
    position: relative;
    overflow: hidden;
  }
  .topic-card::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: var(--accent);
    opacity: 0;
    transition: opacity 0.2s;
  }
  .topic-card:hover {
    border-color: rgba(255,111,145,0.4);
    transform: translateX(4px);
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
  }
  .topic-card:hover::before { opacity: 1; }

  .topic-card-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }
  .topic-num {
    font-size: 0.68rem;
    color: var(--muted);
    background: rgba(0,0,0,0.04);
    border: 1px solid var(--border);
    padding: 0.18rem 0.5rem;
    border-radius: 4px;
    font-weight: 600;
    letter-spacing: 0.04em;
  }
  .mode-pills {
    display: flex;
    gap: 0.3rem;
  }
  .mode-pill {
    font-size: 0.64rem;
    padding: 0.15rem 0.42rem;
    border-radius: 999px;
    font-weight: 600;
  }
  .mode-pill.t { background: rgba(124,111,255,0.1); color: #6c5fff; border: 1px solid rgba(124,111,255,0.2); }
  .mode-pill.k { background: rgba(255,159,64,0.1); color: #d97706; border: 1px solid rgba(255,159,64,0.2); }
  .mode-pill.q { background: rgba(45,158,74,0.1); color: #2d7a3a; border: 1px solid rgba(45,158,74,0.2); }

  .topic-card h3 {
    font-size: 1rem;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .topic-card p {
    font-size: 0.79rem;
    color: var(--muted);
    line-height: 1.55;
  }
  .open-btn {
    font-size: 0.78rem;
    color: var(--accent);
    font-weight: 600;
    margin-top: auto;
    padding-top: 0.5rem;
  }

  footer {
    text-align: center;
    padding: 1.5rem 2rem;
    color: var(--muted);
    font-size: 0.78rem;
    border-top: 1px solid var(--border);
  }

  @media (max-width: 600px) {
    .topics-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header>
  <a href="../../index.html" class="back-btn">← Zurück</a>
  <div class="breadcrumb">
    <span>G23f-Insider</span>
    <span style="opacity:.4;margin:0 .25rem;">/</span>
    <span class="cur">Französisch</span>
  </div>
</header>

<div class="page-hero">
  <div class="subject-label">Fach</div>
  <h1>🇫🇷 Französisch</h1>
  <p>Grammatik, Vokabeln, Texte – nach den Lernzielen des Unterrichts.</p>
</div>

<main class="section">
  <div class="section-title">Themen</div>
  <div class="topics-grid" id="topics-grid">
    <div style="color:var(--muted);font-size:.85rem;padding:1rem;">Lädt…</div>
  </div>
</main>

<footer>
  G23f-Insider · Alle Rechte vorbehalten · Fragen oder Ergänzungen? Einfach bei Elias melden
</footer>

<script>
fetch('themen.json')
  .then(r => r.json())
  .then(themen => {
    const grid = document.getElementById('topics-grid');
    if (!themen.length) {
      grid.innerHTML = '<div style="color:var(--muted);font-size:.85rem;padding:1rem;">Noch keine Themen verfügbar.</div>';
      return;
    }
    grid.innerHTML = themen.map((t, i) => `
      <a href="${t.pfad}" class="topic-card">
        <div class="topic-card-head">
          <span class="topic-num">FRANZ-${String(i+1).padStart(2,'0')}</span>
          <div class="mode-pills">
            ${t.theorie ? '<span class="mode-pill t">Theorie</span>' : ''}
            ${t.karten  ? '<span class="mode-pill k">Karten</span>'  : ''}
            ${t.quiz    ? '<span class="mode-pill q">Quiz</span>'    : ''}
          </div>
        </div>
        <h3>${t.name}</h3>
        <p>${t.beschreibung || ''}</p>
        <span class="open-btn">Lernapp öffnen →</span>
      </a>
    `).join('');
  })
  .catch(() => {
    document.getElementById('topics-grid').innerHTML = '<div style="color:var(--muted);font-size:.85rem;padding:1rem;">Themen konnten nicht geladen werden.</div>';
  });
</script>

</body>
</html>
