name: WHOOP

# Holt stündlich die WHOOP-Werte und trägt sie in den privaten Google-Kalender «WHOOP» ein.
# Erste Anmeldung: auf www.g23f-insider.ch/whoop.html den Code holen, dann hier «Run workflow» mit dem Code starten.
on:
  schedule:
    - cron: '41 * * * *'
  workflow_dispatch:
    inputs:
      code:
        description: 'Nur bei der Anmeldung: Code von www.g23f-insider.ch/whoop.html'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: whoop
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Code verbergen
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.code != '' }}
        env:
          WHOOP_CODE: ${{ inputs.code }}
        run: echo "::add-mask::$WHOOP_CODE"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Abhängigkeiten installieren
        working-directory: tools/whoop-sync
        run: npm install --no-audit --no-fund --loglevel=error
      - name: WHOOP-Werte übertragen
        working-directory: tools/whoop-sync
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          WHOOP_CALENDAR_ID: ${{ secrets.WHOOP_CALENDAR_ID }}
          WHOOP_CLIENT_ID: ${{ secrets.WHOOP_CLIENT_ID }}
          WHOOP_CLIENT_SECRET: ${{ secrets.WHOOP_CLIENT_SECRET }}
          WHOOP_CODE: ${{ inputs.code }}
        run: node whoop.mjs
